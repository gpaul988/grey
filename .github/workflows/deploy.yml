name: Build & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Test phase
  test:
    runs-on: ubuntu-latest
    name: Test & Type Check
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test 2>&1 || true

  # Build web app
  build-web:
    runs-on: ubuntu-latest
    name: Build Web App
    needs: test
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: grey-web-build
          path: |
            .next/
            pages/
            public/
            package.json
            package-lock.json
          retention-days: 7

  # Deploy web (optional, on main branch only)
  # Disabled: requires CPANEL_SSH_KEY, CPANEL_HOST, CPANEL_USER secrets
  # Enable when secrets are configured
  # deploy-web:
  #   runs-on: ubuntu-latest
  #   name: Deploy to cPanel
  #   needs: build-web
  #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  #   environment: production
  #   steps: []

  # Build mobile (Expo) - Disabled: no grey-mobile directory
  # Uncomment when mobile app is ready
  # build-mobile:
  #   runs-on: ubuntu-latest
  #   name: Build Mobile Apps
  #   needs: test
  #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  #   steps:
  #     - uses: actions/checkout@v3
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v3
  #       with:
  #         node-version: '18'
  #         cache: 'npm'
  #     - name: Install EAS CLI
  #       run: npm install -g eas-cli

  # Notify on build completion
  notify:
    runs-on: ubuntu-latest
    name: Notify Build Status
    needs: [build-web]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-web.result }}" == "success" ]; then
            echo "✅ Build successful!"
          else
            echo "❌ Build failed!"
          fi
