name: Build & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Test phase
  test:
    runs-on: ubuntu-latest
    name: Test & Type Check
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test 2>&1 || true

  # Build web app
  build-web:
    runs-on: ubuntu-latest
    name: Build Web App
    needs: test
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: grey-web-build
          path: |
            .next/
            public/
            package.json
            package-lock.json
          retention-days: 7

  # Deploy web to cPanel (main branch only, optional if secrets not set)
  deploy-web:
    runs-on: ubuntu-latest
    name: Deploy to cPanel
    needs: build-web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v3

      - name: Check if deployment secrets are configured
        id: check-secrets
        run: |
          if [ -z "${{ secrets.CPANEL_SSH_KEY }}" ] || [ -z "${{ secrets.CPANEL_HOST }}" ] || [ -z "${{ secrets.CPANEL_USER }}" ]; then
            echo "status=skip" >> $GITHUB_OUTPUT
            echo "Skipping cPanel deployment - secrets not configured"
          else
            echo "status=deploy" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check-secrets.outputs.status == 'deploy'
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download build artifact
        if: steps.check-secrets.outputs.status == 'deploy'
        uses: actions/download-artifact@v4
        with:
          name: grey-web-build
          path: ./build-output

      - name: Setup SSH
        if: steps.check-secrets.outputs.status == 'deploy'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/cpanel_key
          chmod 600 ~/.ssh/cpanel_key
          ssh-keyscan -H ${{ secrets.CPANEL_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to cPanel
        if: steps.check-secrets.outputs.status == 'deploy'
        run: |
          DEPLOY_PATH="/home/${{ secrets.CPANEL_USER }}/public_html/grey"
          echo "Deploying to: $DEPLOY_PATH"
          
          # Create deployment directory if it doesn't exist
          ssh -i ~/.ssh/cpanel_key -o ConnectTimeout=10 ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} \
            "mkdir -p $DEPLOY_PATH && cd $DEPLOY_PATH && pwd"
          
          # Copy build files
          echo "Copying .next directory..."
          scp -i ~/.ssh/cpanel_key -r ./build-output/.next/ \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:$DEPLOY_PATH/.next/
          
          echo "Copying public directory..."
          scp -i ~/.ssh/cpanel_key -r ./build-output/public/ \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:$DEPLOY_PATH/public/
          
          echo "Copying package files..."
          scp -i ~/.ssh/cpanel_key ./build-output/package.json \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:$DEPLOY_PATH/
          scp -i ~/.ssh/cpanel_key ./build-output/package-lock.json \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:$DEPLOY_PATH/ || true

      - name: Install dependencies & restart
        if: steps.check-secrets.outputs.status == 'deploy'
        run: |
          DEPLOY_PATH="/home/${{ secrets.CPANEL_USER }}/public_html/grey"
          echo "Installing dependencies on cPanel..."
          ssh -i ~/.ssh/cpanel_key -o ConnectTimeout=10 ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} \
            "cd $DEPLOY_PATH && npm ci --production && echo 'Dependencies installed'"

      - name: Verify deployment
        if: steps.check-secrets.outputs.status == 'deploy'
        run: |
          DEPLOY_PATH="/home/${{ secrets.CPANEL_USER }}/public_html/grey"
          echo "Verifying deployment..."
          ssh -i ~/.ssh/cpanel_key -o ConnectTimeout=10 ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} \
            "cd $DEPLOY_PATH && ls -la .next/ 2>/dev/null | head -3 && echo 'Deployment verified'"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/cpanel_key

      - name: Deployment skipped
        if: steps.check-secrets.outputs.status == 'skip'
        run: |
          echo "WARNING: cPanel deployment skipped - secrets not configured"
          echo "To enable cPanel deployment, add these secrets to your GitHub repository:"
          echo "  - CPANEL_SSH_KEY: Your cPanel SSH private key"
          echo "  - CPANEL_HOST: Your cPanel server hostname (e.g., server1.example.com)"
          echo "  - CPANEL_USER: Your cPanel username (e.g., greyinf1)"
          echo ""
          echo "See DEPLOYMENT_SECRETS.md for detailed setup instructions"

  # Notify on build completion
  notify:
    runs-on: ubuntu-latest
    name: Notify Build Status
    needs: [build-web]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-web.result }}" == "success" ]; then
            echo "Build successful!"
          else
            echo "Build failed!"
            exit 1
          fi
