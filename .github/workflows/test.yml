name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '24'
  NODE_OPTIONS: --max-old-space-size=1024

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grey
          POSTGRES_PASSWORD: password
          POSTGRES_DB: grey_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        run: npm test -- --run --coverage
        env:
          DATABASE_URL: postgresql://grey:password@localhost:5432/grey_test
          REDIS_URL: redis://localhost:6379
          ENCRYPTION_KEY: test-encryption-key-64-chars-0123456789abcdef
          NODE_ENV: test

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage-final.json

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: postgresql://grey:password@localhost:5432/grey_test
          REDIS_URL: redis://localhost:6379
          ENCRYPTION_KEY: test-encryption-key-64-chars-0123456789abcdef
          NODE_ENV: test

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grey
          POSTGRES_PASSWORD: password
          POSTGRES_DB: grey_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: postgresql://grey:password@localhost:5432/grey_e2e
          NODE_ENV: test

      - name: Start application in background
        run: |
          npm run start > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -f http://localhost:3000 >/dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
        env:
          DATABASE_URL: postgresql://grey:password@localhost:5432/grey_e2e
          NODE_ENV: test
          PORT: 3000

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://grey:password@localhost:5432/grey_e2e
          BASE_URL: http://localhost:3000
          NODE_ENV: test
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/html-report/
          retention-days: 30

      - name: Stop application
        if: always()
        run: |
          PID=$(cat /tmp/server.pid 2>/dev/null)
          if [ -n "$PID" ]; then
            kill $PID 2>/dev/null || true
            sleep 2
          fi
