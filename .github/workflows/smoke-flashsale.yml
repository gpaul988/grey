name: CI — Smoke Flash Sale

on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'scripts/ci/**'
      - 'app/api/store/products/**'
      - 'components/store/**'

jobs:
  smoke-flashsale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Build Next
        run: npm run build

      - name: Start server (background)
        run: |
          npm run start:next &
          echo "Waiting for server..."
          n=0
          until curl -sSf http://localhost:3000/ >/dev/null || [ $n -ge 30 ]; do
            n=$((n+1))
            sleep 1
          done

      - name: Run flash-sale smoke
        env:
          SMOKE_BASE: http://localhost:3000
        run: npm run smoke:flashsale

      - name: Stop background server
        if: always()
        run: |
          ps aux | grep 'next start' | grep -v grep | awk '{print $2}' | xargs -r kill || true
