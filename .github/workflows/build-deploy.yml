name: Build & Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'

env:
  NODE_VERSION: '24'
  NODE_OPTIONS: --max-old-space-size=2048

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type checking
        run: npx tsc --noEmit

      - name: Build Next.js
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=2048

      - name: Run tests
        run: npm test -- --run
        continue-on-error: true

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CPANEL_SSH_KEY != ''

    steps:
      - uses: actions/checkout@v5

      - name: Deploy to cPanel (Staging)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.CPANEL_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/id_rsa "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" << 'DEPLOY'
            cd /home/${{ secrets.CPANEL_USER }}/public_html/staging
            git pull origin main
            npm ci --legacy-peer-deps
            npm run build
            pm2 restart grey-staging
          DEPLOY

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && secrets.CPANEL_SSH_KEY != ''
    environment:
      name: production
      url: https://greyinfotech.com

    steps:
      - uses: actions/checkout@v5

      - name: Deploy to cPanel (Production)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.CPANEL_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/id_rsa "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" << 'DEPLOY'
            cd /home/${{ secrets.CPANEL_USER }}/public_html
            git pull origin main --tags
            npm ci --legacy-peer-deps
            npm run build
            pm2 restart grey
          DEPLOY

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
