<svg viewBox="0 0 820 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Manrope:ital,wght@0,500;1,500&amp;display=swap');
      .word-grey { font-family: 'Sora', Arial, sans-serif; font-weight: 700; fill: #F5F6F8; }
      .word-tech { font-family: 'Sora', Arial, sans-serif; font-weight: 800; fill: #26D4D4; }
      .word-store { font-family: 'Sora', Arial, sans-serif; font-weight: 600; fill: #C7CCD4; }
      .slogan { font-family: 'Manrope', Arial, sans-serif; font-weight: 500; font-style: italic; fill: #D6DAE0; }
    </style>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0A0A0A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Icon: monitor + mouse, matched to the brand's teal + white identity -->
  <g transform="translate(30,67)" filter="url(#softShadow)">
    <!-- monitor -->
    <rect x="0" y="0" width="60" height="42" rx="6" fill="none" stroke="#26D4D4" stroke-width="6"/>
    <rect x="7" y="7" width="46" height="28" rx="2" fill="#26D4D4" fill-opacity="0.16"/>
    <!-- stand -->
    <rect x="24" y="42" width="12" height="9" fill="#26D4D4"/>
    <rect x="12" y="51" width="36" height="7" rx="3.5" fill="#26D4D4"/>

    <!-- mouse, overlapping bottom-right as the accessory -->
    <g transform="rotate(-12 66 58)">
      <rect x="54" y="40" width="24" height="36" rx="12" fill="#26D4D4"/>
      <line x1="66" y1="40" x2="66" y2="54" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
      <circle cx="66" cy="48" r="1.6" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Wordmark, all on one line -->
  <text x="128" y="88" font-size="46" letter-spacing="0.3">
    <tspan class="word-grey">Grey</tspan><tspan class="word-tech" dx="12">Tech</tspan><tspan class="word-store" dx="12">Store</tspan>
  </text>

  <!-- accent rule -->
  <rect x="128" y="106" width="380" height="2.5" rx="1.25" fill="#26D4D4" opacity="0.85"/>

  <!-- Slogan -->
  <text x="128" y="138" font-size="19" class="slogan">Tech that fits your life</text>
</svg>
